<div class="diagram flow-diagram" aria-label="六阶段业务流程互动图">
<div class="diagram-heading"><div><span class="eyebrow">FIG. 01 / 业务流程</span><h3>让每一步，都留下证据。</h3></div><button class="play-control" id="flow-play" aria-pressed="false">播放流程 ▷</button></div>
<div class="flow-start"><span class="role-label">老师</span> 发布要求 <span class="connector">→</span> <span class="role-label student">学生</span> 建立独立项目</div>
<div class="stage-track" aria-label="选择阶段查看详情">
<button class="stage active" data-stage="0" aria-pressed="true"><span>A</span><strong>兴趣探索<br>问题积累</strong><small>原话与问法</small></button>
<button class="stage" data-stage="1" aria-pressed="false"><span>B</span><strong>形成核心<br>Problem</strong><small>归组与困惑</small></button>
<button class="stage" data-stage="2" aria-pressed="false"><span>C</span><strong>搜索诊断<br>假设发展</strong><small>来源与解释</small></button>
<button class="stage" data-stage="3" aria-pressed="false"><span>D</span><strong>研究框架<br>关键验证</strong><small>方法与依据</small></button>
<button class="stage" data-stage="4" aria-pressed="false"><span>E</span><strong>Proposal<br>答辩准备</strong><small>版本与答辩</small></button>
<button class="stage" data-stage="5" aria-pressed="false"><span>F</span><strong>老师审阅<br>开题决定</strong><small>本人提交</small></button>
</div>
<div class="stage-detail" aria-live="polite"><span id="stage-marker">A / F</span><div><h4 id="stage-title">先留下“教室闷”背后的真实问法。</h4><p id="stage-description">保留真实观察和不同问法，只有一条线索也可继续探索，不必立即选定最终题目。</p></div><span class="evidence" id="stage-evidence">留下 → 问题与选择理由</span></div>
<div class="decision-top"><span class="down-arrow">↓</span><strong>老师审阅</strong><span>请选择一种结论，查看后续路径</span></div>
<div class="decision-options"><button data-decision="approve" aria-pressed="true" class="selected"><i class="green-dot"></i>可开题 <span>↗</span></button><button data-decision="supplement" aria-pressed="false"><i class="orange-dot"></i>补证后再判 <span>↶</span></button><button data-decision="redirect" aria-pressed="false"><i class="blue-dot"></i>调整方向 <span>↶</span></button></div>
<div class="branch-route" id="branch-route" aria-live="polite"><span>可开题</span><b>→</b><span>约定首项任务</span><b>→</b><span>开始正式研究</span></div><p class="diagram-caption" id="branch-note">明确谁来做、何时交、交什么、怎样算完成。</p>
</div>
