  <main class="utility-main">
    <header>
      <h1>在本机开始讨论</h1>
      <p>适用于在这台电脑运行的开题工作台。</p>
    </header>
    <section class="utility-card" aria-label="开始讨论的步骤">
      <ol class="utility-steps">
        <li><strong>打开并登录 Codex</strong><p>保持本机开题工作台运行。</p></li>
        <li><strong>从课题页开始讨论</strong><p>在「当前任务」点「跟AI教练开始讨论」。老师从课题页进入辅助审阅。</p></li>
        <li><strong>回网页核对成果</strong><p>同一阶段可以续聊。完成当前阶段后，回网页核对成果。</p></li>
      </ol>
    </section>
    <details class="utility-card">
      <summary>手动安装教学 Skill</summary>
      <p class="utility-note">解压到课题文件夹，保留 <code>.agents/skills</code>。在 Codex 打开该文件夹，新聊天输入 <code>$research-proposal-coach</code>。</p>
      <p class="utility-note"><a href="/downloads/research-proposal-coach.zip" download>下载教学 Skill</a> · <a href="/first-use.html">安装插件并连接网站</a></p>
    </details>
